name: Build and deploy ctakes-tiny-rest

# cTAKES Tiny REST backs smart-handover (CTAKES_URL -> this host, see
# ../smart-handover/.env.production.example). Unlike smart-handover's own
# deploy.yml, the image is built ON the VPS, not on GitHub's runners: the
# Maven reactor needs a pre-populated local .m2 (every other ctakes module
# already installed there) and the UMLS sno_rx_16ab dictionary, neither of
# which is practical to reconstruct on a hosted runner on every push.
#
# Same deploy user/host/key convention as smart-handover's deploy.yml
# (DEPLOY_HOST/PORT/USER/SSH_KEY secrets) — set them on this repo too,
# pointing at the same VPS.

on:
  push:
    branches: [main]
    paths:
      - "ctakes-icu-handover/**"
      - "ctakes-examples/**"
      - "ctakes-user-resources/**"
      - "ctakes-tiny-rest/**"
      - "ctakes-tiny-rest-war/**"
      - "scripts/clean-tiny-rest.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip the Maven/Docker build, just restart the running container"
        type: boolean
        default: false

concurrency:
  group: deploy-ctakes-tiny-rest
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy on VPS
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.CTAKES_DEPLOY_PATH || '/opt/ctakes-tiny-rest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          CFG

      # Full source tree: the reactor build resolves sibling modules from the
      # checkout. Never touches the repo-root resources/ (gitignored models;
      # the dictionary lives in a volume, see docker/setup-dictionary-volume.sh)
      # or any .env files on the VPS. The exclude is anchored with a leading
      # slash on purpose: a bare "resources/" would also drop every module's
      # src/main/resources and the prod piper that build-image.sh checks for.
      - name: Ship source to VPS
        if: ${{ !inputs.skip_build }}
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/resources/' \
            --exclude='target/' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='.DS_Store' \
            --exclude='.env' \
            --exclude='*.env' \
            ./ "vps:$DEPLOY_PATH/"

      - name: Build image on VPS
        if: ${{ !inputs.skip_build }}
        run: ssh vps "cd '$DEPLOY_PATH' && ctakes-tiny-rest-war/docker/build-image.sh"

      - name: Restart service
        run: ssh vps "cd '$DEPLOY_PATH' && docker compose -f ctakes-tiny-rest-war/docker/docker-compose.yml up -d"

      - name: Smoke test
        run: |
          ssh vps 'bash -s' <<'SMOKE'
          set -e
          port="${CTAKES_HOST_PORT:-8081}"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                   -X POST "http://127.0.0.1:${port}/service/process?format=cui" -d "test" || true)
          echo "$code  /service/process"
          [[ $code == 200 ]]
          SMOKE

      - name: Status
        if: always()
        run: ssh vps "cd '$DEPLOY_PATH' && docker compose -f ctakes-tiny-rest-war/docker/docker-compose.yml ps" || true
