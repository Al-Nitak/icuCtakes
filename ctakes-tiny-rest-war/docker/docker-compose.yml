services:
  ctakes-tiny-rest:
    image: ctakes-tiny-rest:latest
    build:
      context: ../..
      dockerfile: ctakes-tiny-rest-war/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CTAKES_REST_PIPER: TinyRestPipeline.prod.piper
      # Set your UTS API key in the shell or a .env file (do not commit the key):
      #   export CTAKES_UMLS_APIKEY=your_uts_api_key
      JAVA_OPTS: >-
        -Xmx6g
        -Djava.awt.headless=true
        -Dctakes.rest.piper=TinyRestPipeline.prod.piper
        -Dctakes.umls_apikey=${CTAKES_UMLS_APIKEY}
    restart: unless-stopped
